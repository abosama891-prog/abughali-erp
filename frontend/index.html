<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام أبو غالي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 50px; }
        button { padding: 15px 30px; font-size: 18px; background-color: #6200ea; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: #3700b3; }
        #result { margin-top: 30px; font-size: 22px; color: #00e676; font-weight: bold; }
        .box { background-color: #1e1e1e; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="box">
        <h1>مرحباً بك في نظام أبو غالي ERP</h1>
        <p>اضغط على الزر بالأسفل للتواصل مع السيرفر</p>
        <button onclick="checkStatus()">اتصال بالسيرفر</button>
        <div id="result"></div>
    </div>

    <script>
        async function checkStatus() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'جاري الاتصال... ⏳';
            try {
                const response = await fetch('https://abughali-erp-production.up.railway.app/');
                const data = await response.json();
                if (data.status === 'running') {
                    resultDiv.innerHTML = '✅ السيرفر يعمل بنجاح والنظام جاهز!';
                } else {
                    resultDiv.innerHTML = '⚠️ السيرفر رد ولكن الحالة غير معروفة.';
                }
            } catch (error) {
                resultDiv.innerHTML = '❌ فشل الاتصال بالسيرفر. تأكد من إعدادات CORS.';
            }
        }
    </script>
</body>
</html>
